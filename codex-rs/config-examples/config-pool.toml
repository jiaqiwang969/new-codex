# Account pool configuration - isolated from main config.toml
# Each provider can have multiple accounts for failover/rotation.
# On failure (400/401/403/429/quota), codex automatically switches to the next account.
#
# Test setup: first accounts use invalid keys to verify failover,
# the LAST account in each pool holds the real working key.

# ── Codex (OpenAI-compatible) provider pool ─────────────────────────
[model_providers.codex]
base_url = "https://code.ppchat.vip/v1"
env_key = "OPENAI_API_KEY_POOL_3"

[[model_providers.codex.account_pool]]
base_url = "https://code.ppchat.vip/v1"
env_key = "OPENAI_API_KEY_POOL_1"

[[model_providers.codex.account_pool]]
base_url = "https://code.ppchat.vip/v1"
env_key = "OPENAI_API_KEY_POOL_2"

[[model_providers.codex.account_pool]]
base_url = "https://code.ppchat.vip/v1"
env_key = "OPENAI_API_KEY_POOL_3"

