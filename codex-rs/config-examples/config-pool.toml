# Account pool configuration - isolated from main config.toml
# `account_pool` is the source of truth when present.
# Every new or resumed session starts probing from key 1.
# If a key fails with 400/401/403/429/quota, Codex cools it down for 10 minutes
# and switches to the next key for the current turn.
# After 10 minutes, the next turn retries key 1 first again.
# If all keys are cooling down, Codex still forces a fresh probe from key 1.

# ── Codex (OpenAI-compatible) provider pool ─────────────────────────
[[model_providers.codex.account_pool]]
base_url = "https://code.ppchat.vip/v1"
env_key = "OPENAI_API_KEY_POOL_1"

[[model_providers.codex.account_pool]]
base_url = "https://code.ppchat.vip/v1"
env_key = "OPENAI_API_KEY_POOL_2"

[[model_providers.codex.account_pool]]
base_url = "https://code.ppchat.vip/v1"
env_key = "OPENAI_API_KEY_POOL_3"

